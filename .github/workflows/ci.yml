name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, unit tests, and module evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Publish reusable outputs to the project binary cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nixos-kaiba-network
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipAddingSubstituter: true
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Check formatting
        run: nix --accept-flake-config fmt -- --ci

      - name: Test the inert Ubuntu signing-gate deployment
        run: tests/deployment/ubuntu_signing_gate_test.sh

      - name: Evaluate every flake system
        run: |
          nix --accept-flake-config flake check --all-systems --no-build -L
          nix flake check ./nix/provisioning --all-systems --no-build -L
          nix flake check ./nix/dns --all-systems --no-build -L
          git diff --exit-code -- \
            flake.lock \
            nix/provisioning/flake.lock \
            nix/dns/flake.lock

      - name: Run fast checks
        run: |
          nix --accept-flake-config build --no-link -L \
            .#checks.x86_64-linux.ci-workflow \
            .#checks.x86_64-linux.module-eval \
            .#checks.x86_64-linux.rpi5-provisioning-image-eval \
            .#checks.x86_64-linux.rpi5-prototype-signed-release-eval \
            .#checks.x86_64-linux.rpi5-root-integrity-record \
            .#checks.x86_64-linux.rpi5-production-media-staging \
            .#checks.x86_64-linux.rpi5-qualification-ceremony \
            .#checks.x86_64-linux.rpi5-secure-boot-target-eval \
            .#checks.x86_64-linux.unit \
            .#checks.x86_64-linux.signing-approval \
            .#checks.x86_64-linux.signing-ceremony \
            .#checks.x86_64-linux.signing-receipts \
            .#checks.x86_64-linux.signing-receipts-integration \
            .#checks.x86_64-linux.ubuntu-signing-gate-deployment \
            ./nix/provisioning#checks.x86_64-linux.development-yubikey-signing \
            ./nix/provisioning#checks.x86_64-linux.device-profile-schema \
            ./nix/provisioning#checks.x86_64-linux.module-eval \
            ./nix/provisioning#checks.x86_64-linux.provisioning-test-result \
            ./nix/provisioning#checks.x86_64-linux.rpi5-probe-bundle \
            ./nix/provisioning#checks.x86_64-linux.rpiboot-metadata-stdout \
            ./nix/provisioning#checks.x86_64-linux.secure-boot-artifacts \
            ./nix/provisioning#checks.x86_64-linux.station-ui \
            ./nix/provisioning#packages.x86_64-linux.kaiba-provision-audit \
            ./nix/provisioning#packages.x86_64-linux.kaiba-provision-authority-bridge \
            ./nix/provisioning#packages.x86_64-linux.kaiba-provision-control \
            ./nix/provisioning#packages.x86_64-linux.kaiba-provision-lane-guard \
            ./nix/provisioning#packages.x86_64-linux.kaiba-provision \
            ./nix/provisioning#packages.x86_64-linux.kaiba-provision-station \
            ./nix/dns#checks.x86_64-linux.module-eval \
            ./nix/dns#checks.x86_64-linux.report-unit

  aarch64-packages:
    name: ARM64 production packages
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      provisioning_receipt_sha256: ${{ steps.provisioning_receipt.outputs.sha256 }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Publish reusable outputs to the project binary cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nixos-kaiba-network
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipAddingSubstituter: true
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build and test all production binaries
        run: |
          nix build --no-link -L \
            ./nix/dns#checks.aarch64-linux.unit \
            ./nix/dns#packages.aarch64-linux.kaiba-agent \
            ./nix/dns#packages.aarch64-linux.kaiba-controller \
            ./nix/dns#packages.aarch64-linux.kaiba-publisher \
            ./nix/provisioning#checks.aarch64-linux.production-media-staging \
            ./nix/provisioning#checks.aarch64-linux.unit \
            ./nix/provisioning#checks.aarch64-linux.rpi5-probe-bundle \
            ./nix/provisioning#checks.aarch64-linux.rpiboot-metadata-stdout \
            ./nix/provisioning#checks.aarch64-linux.secure-boot-artifacts \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision-audit \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision-authority-bridge \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision-control \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision-lane-guard \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision-station \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision-station-demo \
            ./nix/provisioning#packages.aarch64-linux.kaiba-provision-station-pages

      - name: Build the native provisioning test result
        run: nix build ./nix/provisioning#packages.aarch64-linux.provisioning-test-result --out-link provisioning-result -L

      - name: Bind the provisioning result to this source revision
        id: provisioning_receipt
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p ci-receipt
          nix develop ./nix/provisioning --command python3 tests/report/platform_receipt.py \
            --input provisioning-result/platform.json \
            --source-revision "$SOURCE_REVISION" \
            --output ci-receipt/provisioning-aarch64.json
          receipt_sha256="$(sha256sum ci-receipt/provisioning-aarch64.json | cut -d ' ' -f 1)"
          if [[ ! "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid receipt digest::The provisioning receipt digest is malformed."
            exit 1
          fi
          echo "sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the native provisioning result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaiba-provisioning-aarch64-${{ github.sha }}
          path: ci-receipt/provisioning-aarch64.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  provisioning-image:
    name: Raspberry Pi 5 provisioning station image
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Build the provisioning station SD image
        run: |
          nix --accept-flake-config build -L \
            --out-link provisioning-image \
            .#packages.aarch64-linux.rpi5-provisioning-sd-image

      - name: Verify the image archive
        run: |
          image=provisioning-image/sd-image/kaiba-rpi5-provisioning.img.zst
          if [[ -L "$image" || ! -f "$image" ]]; then
            echo "::error title=Image unavailable::Expected one regular image at $image."
            exit 1
          fi
          zstd --test "$image"
          sha256sum "$image"

  dns-integration:
    name: Seven-VM DNS topology and canonical report
    needs:
      - quality
      - aarch64-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix with NixOS test support
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: true
          extra_nix_config: |
            extra-substituters = https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
            system-features = nixos-test benchmark big-parallel kvm
          github_access_token: ${{ github.token }}

      - name: Publish reusable outputs to the project binary cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nixos-kaiba-network
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipAddingSubstituter: true
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Report virtualization mode
        run: |
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM acceleration is available."
          else
            echo "::warning title=KVM unavailable::The topology will use its slower QEMU TCG fallback."
          fi

      - name: Build the deterministic base report
        run: nix build ./nix/dns#dns-test-report --out-link base-result -L

      - name: Download the native ARM64 provisioning result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kaiba-provisioning-aarch64-${{ github.sha }}
          path: ci-input/aarch64

      - name: Verify the native ARM64 provisioning result
        env:
          EXPECTED_SHA256: ${{ needs.aarch64-packages.outputs.provisioning_receipt_sha256 }}
        run: |
          mapfile -d '' receipt_entries < <(find ci-input/aarch64 -mindepth 1 -print0)
          if (( ${#receipt_entries[@]} != 1 )); then
            echo "::error title=Unexpected receipt contents::The ARM64 result artifact must contain exactly one entry."
            exit 1
          fi
          receipt=ci-input/aarch64/provisioning-aarch64.json
          if [[ -L "$receipt" || ! -f "$receipt" ]]; then
            echo "::error title=Unsafe receipt::The ARM64 result must be one regular, non-symbolic-link file."
            exit 1
          fi
          actual_sha256="$(sha256sum "$receipt" | cut -d ' ' -f 1)"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ || "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error title=Receipt digest mismatch::The downloaded ARM64 result does not match its producing job."
            exit 1
          fi

      - name: Compose the canonical test report
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          nix develop ./nix/dns --command python3 tests/report/render.py \
            --result base-result/result.json \
            --events base-result/events.jsonl \
            --evidence base-result/evidence \
            --zones base-result/zones \
            --topology base-result/topology.json \
            --schema base-result/result.schema.json \
            --provisioning base-result/provisioning.json \
            --provisioning-schema base-result/provisioning.schema.json \
            --provisioning-platform-result ci-input/aarch64/provisioning-aarch64.json \
            --expected-source-revision "$SOURCE_REVISION" \
            --output ci-report

      - name: Verify the report manifest
        id: verify_report
        working-directory: ci-report
        run: sha256sum --check manifest.sha256

      - name: Enforce schema, security, and functional gates
        run: |
          nix build --no-link -L \
            ./nix/dns#dns-schema-gate \
            ./nix/dns#dns-security-gate \
            ./nix/dns#dns-test-gate
          cmp base-result/result.schema.json ci-report/result.schema.json
          cmp base-result/provisioning.schema.json ci-report/provisioning.schema.json
          nix develop ./nix/dns --command python3 tests/report/schema_gate.py \
            --schema ci-report/result.schema.json \
            --instance ci-report/result.json
          nix develop ./nix/dns --command python3 tests/report/schema_gate.py \
            --schema ci-report/provisioning.schema.json \
            --instance ci-report/provisioning.json
          nix develop ./nix/dns --command python3 tests/report/gate.py \
            --manifest tests/report/required-assertions.json \
            --scope functional \
            ci-report/result.json
          nix develop ./nix/dns --command python3 tests/report/gate.py \
            --manifest tests/report/required-assertions.json \
            --scope security \
            ci-report/result.json

      - name: Collect the DNS test report
        id: collect_report
        if: ${{ always() }}
        run: |
          if [[ ! -f ci-report/manifest.sha256 ]]; then
            echo "::error title=Report unavailable::Canonical report composition did not complete."
            exit 1
          fi

      - name: Upload the DNS test report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaiba-dns-test-report
          path: ci-report/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Assemble and validate the GitHub Pages site
        id: assemble_pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.verify_report.outcome == 'success' && steps.collect_report.outcome == 'success' }}
        run: |
          if [[ -e site/reports ]]; then
            echo "::error title=Reserved site path::site/reports is reserved for generated reports."
            exit 1
          fi
          if [[ -e site/provisioning-demo ]]; then
            echo "::error title=Reserved site path::site/provisioning-demo is generated from the shared station UI."
            exit 1
          fi
          if [[ -e pages-site ]]; then
            echo "::error title=Reserved build path::pages-site must not exist before assembly."
            exit 1
          fi
          nix build ./nix/provisioning#kaiba-provision-station-pages --out-link station-pages -L
          mkdir -p pages-site/reports/latest pages-site/provisioning-demo
          cp --recursive --no-dereference site/. pages-site/
          cp --recursive --no-dereference ci-report/. pages-site/reports/latest/
          cp --recursive --no-dereference station-pages/. pages-site/provisioning-demo/
          for asset in index.html styles.css transport.js app.js; do
            cmp "provisioning/internal/provisioning/stationui/web/$asset" "pages-site/provisioning-demo/$asset"
          done
          nix develop ./nix/dns --command python3 tests/site/validate.py pages-site

      - name: Upload the project site for GitHub Pages
        id: pages_artifact
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.assemble_pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site/
          retention-days: 1

  deploy-report:
    name: Publish project site
    needs: dns-integration
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.dns-integration.outputs.pages_artifact_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy the project site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
