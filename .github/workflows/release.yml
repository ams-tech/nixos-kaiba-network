name: Release signed secure-boot target image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build the Raspberry Pi 5 signed secure-boot target image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      tag_object_sha: ${{ steps.image-binding.outputs.tag_object_sha }}
    steps:
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::$RELEASE_TAG is not a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is on main
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SOURCE_REVISION" origin/main; then
            echo "::error title=Unreviewed release commit::$SOURCE_REVISION is not reachable from main."
            exit 1
          fi

      - name: Verify the annotated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/ci/verify_release_tag.sh "$RELEASE_TAG" "$SOURCE_REVISION" origin/main

      - name: Read the immutable release image binding
        id: image-binding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          binding="$(
            bash scripts/ci/read_release_image_binding.sh \
              "$RELEASE_TAG" "$SOURCE_REVISION"
          )"
          IFS=$'\t' read -r archive_sha256 media_sha256 archive_size_bytes tag_object_sha \
            <<< "$binding"
          {
            echo "archive_sha256=$archive_sha256"
            echo "media_sha256=$media_sha256"
            echo "archive_size_bytes=$archive_size_bytes"
            echo "tag_object_sha=$tag_object_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Await, stage, and verify the prebuilt release image
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ steps.image-binding.outputs.archive_sha256 }}
          EXPECTED_ARCHIVE_SIZE_BYTES: ${{ steps.image-binding.outputs.archive_size_bytes }}
          EXPECTED_MEDIA_SHA256: ${{ steps.image-binding.outputs.media_sha256 }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image_name="kaiba-rpi5-development-secure-boot-target-${RELEASE_TAG}.img.zst"
          mkdir -p target-image
          for attempt in $(seq 1 90); do
            if gh release download "$RELEASE_TAG" \
              --pattern "$image_name" \
              --dir target-image \
              --clobber 2>/dev/null; then
              break
            fi
            if (( attempt == 90 )); then
              echo "::error title=Prebuilt image unavailable::The digest-pinned image was not uploaded to the draft release."
              exit 1
            fi
            sleep 10
          done

          source_image="target-image/$image_name"
          if [[ -L "$source_image" || ! -f "$source_image" ]]; then
            echo "::error title=Image unavailable::Expected one regular image at $source_image."
            exit 1
          fi
          zstd --test "$source_image"

          if [[ "$(sha256sum "$source_image" | cut -d ' ' -f 1)" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error title=Archive digest mismatch::The uploaded image is not the verified target archive."
            exit 1
          fi

          if [[ "$(zstd --decompress --stdout "$source_image" | sha256sum | cut -d ' ' -f 1)" != "$EXPECTED_MEDIA_SHA256" ]]; then
            echo "::error title=Media digest mismatch::The uploaded archive does not contain the verified target image."
            exit 1
          fi

          image_size="$(stat --format=%s "$source_image")"
          if (( image_size != EXPECTED_ARCHIVE_SIZE_BYTES || image_size >= 2147483648 )); then
            echo "::error title=Image size mismatch::The uploaded image has an unexpected size."
            exit 1
          fi

          mkdir -p release-assets
          install --mode=0644 "$source_image" "release-assets/$image_name"
          (
            cd release-assets
            sha256sum "$image_name" > "$image_name.sha256"
            sha256sum --check --strict "$image_name.sha256"
          )

      - name: Upload the release assets for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-target-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish-release:
    name: Publish the GitHub release
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-target-${{ github.sha }}
          path: release-assets

      - name: Verify and publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.build-image.outputs.tag_object_sha }}
        run: |
          image_name="kaiba-rpi5-development-secure-boot-target-${RELEASE_TAG}.img.zst"
          image="release-assets/$image_name"
          checksum="$image.sha256"
          checksum_name="$image_name.sha256"
          release_title="Kaiba signed secure-boot target image $RELEASE_TAG"

          mapfile -d '' assets < <(find release-assets -mindepth 1 -maxdepth 1 -print0)
          if (( ${#assets[@]} != 2 )); then
            echo "::error title=Unexpected release contents::Expected exactly the image and its checksum."
            exit 1
          fi
          for asset in "$image" "$checksum"; do
            if [[ -L "$asset" || ! -f "$asset" ]]; then
              echo "::error title=Unsafe release asset::$asset must be a regular, non-symbolic-link file."
              exit 1
            fi
          done

          mapfile -t checksum_lines < "$checksum"
          actual_sha256="$(sha256sum "$image" | cut -d ' ' -f 1)"
          expected_checksum_line="$actual_sha256  $image_name"
          if (( ${#checksum_lines[@]} != 1 )) || [[ "${checksum_lines[0]}" != "$expected_checksum_line" ]]; then
            echo "::error title=Invalid checksum::The checksum must name and match the expected image."
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check --strict "$image_name.sha256"
          )

          release_marker="Raspberry Pi 5 signed secure-boot target SD image verified for release at commit ${SOURCE_REVISION}."
          release_notes="$release_marker

          This development target image contains the signed boot payload and
          dm-verity root built from ${SOURCE_REVISION}. It enables the fixed
          development-only USB SSH interface documented by that revision and
          contains no signing key or signing capability. Write it to a 4
          GB-or-larger SD card, install it in the provisioned target Pi, and
          boot normally with BOOTSEL untouched."

          verify_remote_tag() {
            bash scripts/ci/verify_remote_release_tag.sh \
              "$GH_REPO" "$RELEASE_TAG" "$SOURCE_REVISION" \
              "$EXPECTED_TAG_OBJECT_SHA"
          }

          verify_remote_tag
          successful_ci_runs="$(
            gh api \
              --method GET \
              "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$SOURCE_REVISION" \
              -f status=success \
              -f per_page=1 \
              --jq .total_count
          )"
          if [[ ! "$successful_ci_runs" =~ ^[0-9]+$ ]] || (( successful_ci_runs < 1 )); then
            echo "::error title=CI approval missing::No successful main-branch CI run exists for $SOURCE_REVISION."
            exit 1
          fi

          if release_metadata="$(
            gh release view "$RELEASE_TAG" \
              --json isDraft,isPrerelease,name \
              --jq '[.isDraft, .isPrerelease, .name] | @tsv' \
              2>/dev/null
          )"; then
            IFS=$'\t' read -r is_draft is_prerelease existing_title <<< "$release_metadata"
            existing_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            if [[ "$is_draft" != true || "$is_prerelease" != false ]] || \
              [[ "$existing_title" != "$release_title" || "$existing_body" != "$release_marker"* ]]; then
              echo "::error title=Release already exists::Refusing to modify an unexpected" \
                "or published $RELEASE_TAG release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "$release_title" \
              --notes "$release_notes" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" "$image" "$checksum" --clobber
          mapfile -t uploaded_assets < <(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
          )
          if (( ${#uploaded_assets[@]} != 2 )) || \
            [[ "${uploaded_assets[0]}" != "$image_name" || "${uploaded_assets[1]}" != "$checksum_name" ]]; then
            echo "::error title=Unexpected published assets::The draft release does not contain" \
              "exactly the verified image and checksum."
            exit 1
          fi

          verify_remote_tag
          gh release edit "$RELEASE_TAG" --draft=false
