name: Release operator-started secure-boot provisioning image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build the Raspberry Pi 5 operator-started secure-boot station image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::$RELEASE_TAG is not a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is on main
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SOURCE_REVISION" origin/main; then
            echo "::error title=Unreviewed release commit::$SOURCE_REVISION is not reachable from main."
            exit 1
          fi

      - name: Verify the annotated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/ci/verify_release_tag.sh "$RELEASE_TAG" "$SOURCE_REVISION" origin/main

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Build the operator-started secure-boot station SD image
        run: |
          nix --accept-flake-config build -L \
            --out-link provisioning-image \
            .#packages.aarch64-linux.rpi5-development-secure-boot-station-sd-image

      - name: Stage and verify the release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source_image=provisioning-image/sd-image/kaiba-rpi5-development-secure-boot-station.img.zst
          if [[ -L "$source_image" || ! -f "$source_image" ]]; then
            echo "::error title=Image unavailable::Expected one regular image at $source_image."
            exit 1
          fi
          zstd --test "$source_image"

          image_size="$(stat --format=%s "$source_image")"
          if (( image_size >= 2147483648 )); then
            echo "::error title=Image too large::The compressed image exceeds GitHub's 2 GiB release-asset limit."
            exit 1
          fi

          image_name="kaiba-rpi5-development-secure-boot-station-${RELEASE_TAG}.img.zst"
          mkdir -p release-assets
          install --mode=0644 "$source_image" "release-assets/$image_name"
          (
            cd release-assets
            sha256sum "$image_name" > "$image_name.sha256"
            sha256sum --check --strict "$image_name.sha256"
          )

      - name: Upload the release assets for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-station-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish-release:
    name: Publish the GitHub release
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-station-${{ github.sha }}
          path: release-assets

      - name: Verify and publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          image_name="kaiba-rpi5-development-secure-boot-station-${RELEASE_TAG}.img.zst"
          image="release-assets/$image_name"
          checksum="$image.sha256"
          checksum_name="$image_name.sha256"
          release_title="Kaiba operator-started secure-boot provisioning image $RELEASE_TAG"

          mapfile -d '' assets < <(find release-assets -mindepth 1 -maxdepth 1 -print0)
          if (( ${#assets[@]} != 2 )); then
            echo "::error title=Unexpected release contents::Expected exactly the image and its checksum."
            exit 1
          fi
          for asset in "$image" "$checksum"; do
            if [[ -L "$asset" || ! -f "$asset" ]]; then
              echo "::error title=Unsafe release asset::$asset must be a regular, non-symbolic-link file."
              exit 1
            fi
          done

          mapfile -t checksum_lines < "$checksum"
          actual_sha256="$(sha256sum "$image" | cut -d ' ' -f 1)"
          expected_checksum_line="$actual_sha256  $image_name"
          if (( ${#checksum_lines[@]} != 1 )) || [[ "${checksum_lines[0]}" != "$expected_checksum_line" ]]; then
            echo "::error title=Invalid checksum::The checksum must name and match the expected image."
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check --strict "$image_name.sha256"
          )

          release_marker="Raspberry Pi 5 operator-started secure-boot provisioning-station SD image built from commit ${SOURCE_REVISION}."
          release_notes="$release_marker

          This development image is mutation-capable for one fixed sacrificial
          Raspberry Pi 5, USB lane, and UART adapter. It contains the verified
          public v0.1.6 signed payload and no signing key. Boot the provisioning
          Pi with the target disconnected, then run \`kaiba-secure-boot
          provision\` at the autologin shell."

          verify_remote_tag() {
            bash scripts/ci/verify_remote_release_tag.sh \
              "$GH_REPO" "$RELEASE_TAG" "$SOURCE_REVISION"
          }

          verify_remote_tag
          successful_ci_runs="$(
            gh api \
              --method GET \
              "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$SOURCE_REVISION" \
              -f status=success \
              -f per_page=1 \
              --jq .total_count
          )"
          if [[ ! "$successful_ci_runs" =~ ^[0-9]+$ ]] || (( successful_ci_runs < 1 )); then
            echo "::error title=CI approval missing::No successful main-branch CI run exists for $SOURCE_REVISION."
            exit 1
          fi

          if release_metadata="$(
            gh release view "$RELEASE_TAG" \
              --json isDraft,isPrerelease,name \
              --jq '[.isDraft, .isPrerelease, .name] | @tsv' \
              2>/dev/null
          )"; then
            IFS=$'\t' read -r is_draft is_prerelease existing_title <<< "$release_metadata"
            existing_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            if [[ "$is_draft" != true || "$is_prerelease" != false ]] || \
              [[ "$existing_title" != "$release_title" || "$existing_body" != "$release_marker"* ]]; then
              echo "::error title=Release already exists::Refusing to modify an unexpected" \
                "or published $RELEASE_TAG release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "$release_title" \
              --notes "$release_notes" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" "$image" "$checksum" --clobber
          mapfile -t uploaded_assets < <(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
          )
          if (( ${#uploaded_assets[@]} != 2 )) || \
            [[ "${uploaded_assets[0]}" != "$image_name" || "${uploaded_assets[1]}" != "$checksum_name" ]]; then
            echo "::error title=Unexpected published assets::The draft release does not contain" \
              "exactly the verified image and checksum."
            exit 1
          fi

          verify_remote_tag
          gh release edit "$RELEASE_TAG" --draft=false
