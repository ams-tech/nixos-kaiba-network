name: Release signed secure-boot target image

on:
  push:
    tags:
      - "v*"
  # This no-input dispatch is a deliberately one-release recovery path. The
  # validation job below binds it to the existing immutable v0.1.15 tag and
  # draft; it cannot select or create another release.
  workflow_dispatch:

permissions:
  contents: read

env:
  RECOVERY_REPOSITORY: ams-tech/nixos-kaiba-network
  RECOVERY_RELEASE_TAG: v0.1.15
  RECOVERY_SOURCE_REVISION: 206b204d2ddfdce2e1bb2843df5cd5c7c10d6622
  RECOVERY_TAG_OBJECT_SHA: 7d002d93ef952191e817eebc40819a03198727ef
  RECOVERY_ARCHIVE_SHA256: cf9bc81a63cb0eb48ddfec2a1056ca0e6991ed34dc3c533a9e6ce66629d95aea
  RECOVERY_MEDIA_SHA256: cfc2706ad7d88325b179a27183f23495096dc0e20075a3887f63f2e95fca9ef3
  RECOVERY_ARCHIVE_SIZE_BYTES: "1199718377"
  RECOVERY_RELEASE_ID: "383678534"
  RECOVERY_IMAGE_ASSET_ID: "547534361"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'refs/tags/v0.1.15' || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate the signed target release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.image-binding.outputs.archive_sha256 }}
      archive_size_bytes: ${{ steps.image-binding.outputs.archive_size_bytes }}
      media_sha256: ${{ steps.image-binding.outputs.media_sha256 }}
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      source_revision: ${{ steps.release-context.outputs.source_revision }}
      tag_object_sha: ${{ steps.image-binding.outputs.tag_object_sha }}
    steps:
      - name: Check out the release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the release context
        id: release-context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REVISION: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GH_REPO" != "$RECOVERY_REPOSITORY" || "$EVENT_REF" != refs/heads/main ]] || \
              [[ "$EVENT_REVISION" != "$WORKFLOW_REVISION" ]]; then
              echo "::error title=Invalid recovery context::v0.1.15 recovery must run from the canonical repository's current main workflow."
              exit 1
            fi
            release_tag="$RECOVERY_RELEASE_TAG"
          elif [[ "$EVENT_NAME" == push && "$EVENT_REF" == "refs/tags/$EVENT_REF_NAME" ]]; then
            release_tag="$EVENT_REF_NAME"
          else
            echo "::error title=Invalid release event::Only a tag push or the fixed v0.1.15 recovery dispatch is allowed."
            exit 1
          fi

          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::$release_tag is not a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          source_revision="$(
            git rev-parse --verify --end-of-options \
              "refs/tags/${release_tag}^{commit}"
          )"
          if [[ "$EVENT_NAME" == push && "$source_revision" != "$EVENT_REVISION" ]]; then
            echo "::error title=Tag source mismatch::$release_tag does not resolve to the pushed commit."
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]] && \
            [[ "$source_revision" != "$RECOVERY_SOURCE_REVISION" ]]; then
            echo "::error title=Recovery tag moved::v0.1.15 no longer resolves to its reviewed source commit."
            exit 1
          fi
          {
            echo "release_tag=$release_tag"
            echo "source_revision=$source_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the release commit is on main
        env:
          SOURCE_REVISION: ${{ steps.release-context.outputs.source_revision }}
        run: |
          if ! git merge-base --is-ancestor "$SOURCE_REVISION" origin/main; then
            echo "::error title=Unreviewed release commit::$SOURCE_REVISION is not reachable from main."
            exit 1
          fi

      - name: Verify the annotated release tag
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.release-context.outputs.source_revision }}
        run: bash scripts/ci/verify_release_tag.sh "$RELEASE_TAG" "$SOURCE_REVISION" origin/main

      - name: Read the immutable release image binding
        id: image-binding
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.release-context.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.release-context.outputs.source_revision }}
        run: |
          binding="$(
            bash scripts/ci/read_release_image_binding.sh \
              "$RELEASE_TAG" "$SOURCE_REVISION"
          )"
          IFS=$'\t' read -r archive_sha256 media_sha256 archive_size_bytes tag_object_sha \
            <<< "$binding"
          if [[ "$EVENT_NAME" == workflow_dispatch ]] && \
            { [[ "$RELEASE_TAG" != "$RECOVERY_RELEASE_TAG" ]] || \
              [[ "$SOURCE_REVISION" != "$RECOVERY_SOURCE_REVISION" ]] || \
              [[ "$archive_sha256" != "$RECOVERY_ARCHIVE_SHA256" ]] || \
              [[ "$media_sha256" != "$RECOVERY_MEDIA_SHA256" ]] || \
              [[ "$archive_size_bytes" != "$RECOVERY_ARCHIVE_SIZE_BYTES" ]] || \
              [[ "$tag_object_sha" != "$RECOVERY_TAG_OBJECT_SHA" ]]; }; then
            echo "::error title=Recovery binding changed::The immutable v0.1.15 release binding no longer matches the reviewed recovery constants."
            exit 1
          fi
          {
            echo "archive_sha256=$archive_sha256"
            echo "media_sha256=$media_sha256"
            echo "archive_size_bytes=$archive_size_bytes"
            echo "tag_object_sha=$tag_object_sha"
          } >> "$GITHUB_OUTPUT"

  fetch-draft-image:
    name: Fetch the pre-staged draft release image
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub only exposes draft releases to callers with push access. Keep this
    # permission in a job that neither checks out the repository nor invokes
    # its scripts.
    permissions:
      contents: write
    steps:
      - name: Await and stage the prebuilt release image
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          image_name="kaiba-rpi5-development-secure-boot-target-${RELEASE_TAG}.img.zst"
          mkdir -p target-image
          download_error="$RUNNER_TEMP/release-download-error.log"
          for attempt in $(seq 1 90); do
            if gh release download "$RELEASE_TAG" \
              --pattern "$image_name" \
              --dir target-image \
              --clobber 2>"$download_error"; then
              break
            fi
            if (( attempt == 90 )); then
              cat "$download_error" >&2
              echo "::error title=Prebuilt image unavailable::The digest-pinned image could not be downloaded from the draft release."
              exit 1
            fi
            sleep 10
          done

          source_image="target-image/$image_name"
          if [[ -L "$source_image" || ! -f "$source_image" ]]; then
            echo "::error title=Image unavailable::Expected one regular image at $source_image."
            exit 1
          fi

      - name: Upload the unverified release image for validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-target-unverified-${{ needs.validate-release.outputs.source_revision }}
          path: target-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  build-image:
    name: Verify the Raspberry Pi 5 signed secure-boot target image
    needs:
      - validate-release
      - fetch-draft-image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions: {}
    steps:
      - name: Download the unverified release image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-target-unverified-${{ needs.validate-release.outputs.source_revision }}
          path: target-image

      - name: Verify the prebuilt release image
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.validate-release.outputs.archive_sha256 }}
          EXPECTED_ARCHIVE_SIZE_BYTES: ${{ needs.validate-release.outputs.archive_size_bytes }}
          EXPECTED_MEDIA_SHA256: ${{ needs.validate-release.outputs.media_sha256 }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          image_name="kaiba-rpi5-development-secure-boot-target-${RELEASE_TAG}.img.zst"
          mapfile -d '' image_entries < <(find target-image -mindepth 1 -maxdepth 1 -print0)
          if (( ${#image_entries[@]} != 1 )); then
            echo "::error title=Unexpected image contents::Expected exactly one staged target image."
            exit 1
          fi

          source_image="target-image/$image_name"
          if [[ -L "$source_image" || ! -f "$source_image" ]]; then
            echo "::error title=Unsafe image::Expected one regular image at $source_image."
            exit 1
          fi
          zstd --test "$source_image"

          if [[ "$(sha256sum "$source_image" | cut -d ' ' -f 1)" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error title=Archive digest mismatch::The uploaded image is not the verified target archive."
            exit 1
          fi

          if [[ "$(zstd --decompress --stdout "$source_image" | sha256sum | cut -d ' ' -f 1)" != "$EXPECTED_MEDIA_SHA256" ]]; then
            echo "::error title=Media digest mismatch::The uploaded archive does not contain the verified target image."
            exit 1
          fi

          image_size="$(stat --format=%s "$source_image")"
          if (( image_size != EXPECTED_ARCHIVE_SIZE_BYTES || image_size >= 2147483648 )); then
            echo "::error title=Image size mismatch::The uploaded image has an unexpected size."
            exit 1
          fi

          mkdir -p release-assets
          install --mode=0644 "$source_image" "release-assets/$image_name"
          (
            cd release-assets
            sha256sum "$image_name" > "$image_name.sha256"
            sha256sum --check --strict "$image_name.sha256"
          )

      - name: Upload the release assets for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-target-${{ needs.validate-release.outputs.source_revision }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish-release:
    name: Publish the GitHub release
    needs:
      - validate-release
      - build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download the verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kaiba-rpi5-development-secure-boot-target-${{ needs.validate-release.outputs.source_revision }}
          path: release-assets

      - name: Verify and publish the release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          SOURCE_REVISION: ${{ needs.validate-release.outputs.source_revision }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.validate-release.outputs.archive_sha256 }}
          EXPECTED_ARCHIVE_SIZE_BYTES: ${{ needs.validate-release.outputs.archive_size_bytes }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate-release.outputs.tag_object_sha }}
        run: bash scripts/ci/publish_verified_release.sh release-assets
